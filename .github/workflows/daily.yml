name: 매일 청약 확인

on:
  schedule:
    # GitHub cron은 UTC 기준 → 한국시간 06:17, 17:47 (정각은 지연이 잦아 피함)
    - cron: '17 21 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['site/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-cheongyak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 공고 수집 · 판정 · 암호화
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_SALT: ${{ secrets.APP_SALT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/build.mjs

      - name: 알림 기록 저장 (암호화된 파일)
        run: |
          git config user.name "cheongyak-bot"
          git config user.email "cheongyak-bot@users.noreply.github.com"
          git add state/state.enc.json
          git diff --cached --quiet || git commit -m "state: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push || echo "state push 실패 (다음 실행에 재시도)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
