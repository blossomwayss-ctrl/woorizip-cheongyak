<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="referrer" content="no-referrer" />
  <title>우리집 청약</title>
  <meta name="theme-color" content="#2F5D50" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="우리집청약" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 잠금 화면 -->
  <section id="lock" class="lock" hidden>
    <div class="lock-card">
      <img src="icons/icon-192.png" alt="" class="lock-logo" />
      <h1>우리집 청약</h1>
      <p class="muted">우리 부부만 보는 청약 비서예요.<br />함께 정한 비밀번호를 입력하세요.</p>
      <form id="lockForm" autocomplete="off">
        <input id="pw" type="password" inputmode="text" placeholder="비밀번호" autocomplete="current-password" required />
        <label class="remember"><input id="remember" type="checkbox" checked /> 이 휴대폰에서는 다음부터 자동으로 열기</label>
        <button type="submit" class="btn primary wide" id="unlockBtn">열기</button>
        <p id="lockMsg" class="lock-msg" role="alert"></p>
      </form>
    </div>
  </section>

  <!-- 본 화면 -->
  <div id="app" class="app" hidden>
    <header class="top">
      <div>
        <h1 class="title">우리집 청약</h1>
        <p class="sub" id="updated">—</p>
      </div>
      <button class="icon-btn" id="refreshBtn" aria-label="새로고침" title="새로고침">↻</button>
    </header>

    <div id="banner"></div>
    <main id="view" class="view"></main>

    <nav class="tabs" role="tablist">
      <button data-tab="home" class="active"><span class="ti">🏠</span>추천</button>
      <button data-tab="map"><span class="ti">🗺️</span>지도</button>
      <button data-tab="all"><span class="ti">📋</span>전체</button>
      <button data-tab="cal"><span class="ti">🗓️</span>일정</button>
      <button data-tab="docs"><span class="ti">📎</span>서류</button>
      <button data-tab="me"><span class="ti">👫</span>우리정보</button>
    </nav>
  </div>

  <!-- 상세 시트 -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button class="sheet-close" data-close aria-label="닫기">✕</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
